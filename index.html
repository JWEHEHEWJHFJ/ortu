<style>

.login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 10% 0,#c7d8ff55,transparent),radial-gradient(700px 500px at 100% 100%,#d9ccff66,transparent)}

.nv:hover{background:var(--bl);color:var(--b)}.nv.on{background:var(--bl);color:var(--b);box-shadow:inset 3px 0 0 var(--b)}
.promo{margin-top:auto;background:var(--vl);border-radius:16px;padding:14px;font-size:12px;color:var(--sub);line-height:1.5}.promo b{color:var(--ink);display:block;font-size:13px}
.main{padding:22px 26px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.top h1{font-size:22px;font-weight:800}.top small{color:var(--sub);font-size:12px;display:block;font-weight:500}
.ta{display:flex;gap:10px;align-items:center}.ic{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;position:relative}

.av{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh);animation:up .5s both}

.hero{background:linear-gradient(120deg,#e6eeff,#f1ecff 60%,#e8f6ff);color:#0f1b3d;display:flex;align-items:center;gap:20px;overflow:hidden;position:relative;min-height:190px}
@media(prefers-color-scheme:dark){:root:not([data-t=l]) .hero{background:linear-gradient(120deg,#1a2b5c,#2a2158)!important;color:#eaf0ff}}
.hero .t{flex:1;z-index:1}.hero h2{font-size:26px;line-height:1.2;font-weight:800}.hero p{margin:8px 0 14px;font-size:14px;opacity:.8;line-height:1.55}
.hero .btn{display:inline-block;padding:12px 20px;font-size:14px}
.orb{width:150px;height:150px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:54px;font-weight:800;position:relative;flex:none;box-shadow:0 20px 50px #4f46e555;animation:fl 4s ease-in-out infinite}
.orb:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed #6d5dfc66;animation:sp 18s linear infinite}
.orb em{position:absolute;font-style:normal;font-size:12px;font-weight:700;background:var(--card);color:var(--ink);border-radius:99px;padding:6px 10px;box-shadow:var(--sh);white-space:nowrap}

@keyframes fl{50%{transform:translateY(-8px)}}@keyframes sp{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.st{border-radius:20px;padding:14px;position:relative;overflow:hidden;animation:up .5s both;cursor:pointer}

.st .ix{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#fff9}
.c-b{background:var(--bl);color:var(--b)}.c-g{background:var(--gl);color:var(--g)}.c-a{background:var(--al);color:var(--a)}.c-v{background:var(--vl);color:var(--v)}.c-r{background:var(--rl);color:var(--r)}

.two{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}

.tag{font-size:11px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.sc{border-left:4px solid var(--b);background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}.sc b{font-size:13px;display:block}.sc small{color:var(--sub);font-size:12px}
.cal .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}.cal .h button{width:30px;height:30px;border-radius:10px;background:var(--bg)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.cg .w{font-size:10px;color:var(--sub);font-weight:700;padding:4px 0}
.cg button{aspect-ratio:1;border-radius:50%;position:relative;font-weight:600;font-size:12px}.cg button:hover{background:var(--bl)}
.cg .td{background:var(--b)!important;color:#fff}.cg .sel{outline:2px solid var(--b2)}.cg .lb{color:var(--r)}.cg .tl{background:var(--bl)}
.cg .dot:after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips span{font-size:11px;font-weight:700;border-radius:8px;padding:4px 8px}
.pb{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 2px}.pb div{height:100%;border-radius:9px;transition:width 1s}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.sub{cursor:pointer;transition:.2s}.sub:hover{transform:translateY(-3px)}.sub h4{font-size:14px;line-height:1.3}.sub small{color:var(--sub);font-size:12px}
.nt{border-left:5px solid;border-radius:16px;padding:14px;animation:up .5s both}.nt b{font-size:13px}.nt p{font-size:13px;line-height:1.55;margin-top:6px;color:var(--ink)}
.mb{position:fixed;inset:0;background:#0b122699;backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50}
.md{background:var(--card);border-radius:24px;max-width:460px;width:100%;max-height:82vh;overflow:auto;padding:20px;animation:up .3s}
.md h3{font-size:16px;margin-bottom:4px}.x{float:right;width:32px;height:32px;border-radius:10px;background:var(--bg)}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:13px}
.bn{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:99}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
.lbox{grid-template-columns:1fr}.lhero{padding:26px}.lform{padding:26px}.lhero h1{font-size:22px}
.app{grid-template-columns:1fr}.side{display:none}.main{padding:14px 14px 100px}
.bn{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:24px;box-shadow:0 10px 40px rgba(20,40,110,.25);padding:6px;z-index:40}
.bn button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:8px 0;border-radius:18px;color:var(--sub)}.bn button.on{background:var(--grad);color:#fff}
.hero{flex-direction:column-reverse;text-align:center;padding:18px}.hero h2{font-size:21px}.orb{width:110px;height:110px;font-size:40px}.orb em:nth-child(1){left:-50px}.orb em:nth-child(2){right:-46px}
.ql{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.top h1{font-size:18px}.hd{display:none}
}
</style>
